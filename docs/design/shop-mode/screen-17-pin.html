<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17 PIN · Shop mode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="shop.css">
<style>body{margin:0;background:#f5ead8}</style>
</head>
<body>
<div class="shop is-touch" data-screen-label="17 PIN">
  <header class="shop-topbar">
    <a class="shop-iconbtn" href="screen-16-switch-user.html" aria-label="Back"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 class="shop-topbar__title">Enter PIN</h1>
    <details class="shop-usermenu">
      <summary class="shop-chip"><span class="shop-avatar">MJ</span><span class="shop-chip__name">Maya</span><svg class="shop-ico shop-ico--sm shop-chip__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary>
      <div class="shop-menu" role="menu">
        <div class="shop-menu__head"><span class="shop-avatar">MJ</span><div><div class="shop-menu__name">Maya Jensen</div><div class="shop-meta">Shop floor</div></div></div>
        <a class="shop-menu__item" role="menuitem" href="screen-16-switch-user.html"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Switch user</a>
        <a class="shop-menu__item" role="menuitem" href="screen-18-locked.html"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Lock</a>
        <a class="shop-menu__item" role="menuitem" href="#"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg>Office</a>
        <div class="shop-menu__sep"></div>
        <a class="shop-menu__item shop-menu__item--danger" role="menuitem" href="#"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Log out</a>
      </div>
    </details>
  </header>
  <main class="shop-page shop-page--center">
    <div class="shop-pin">
      <div class="shop-pin__who"><span class="shop-avatar shop-avatar--xl shop-avatar--accent">TB</span><h2 class="shop-title">Hi Tom</h2><p class="shop-meta">Enter your 4–6 digit PIN</p></div>
      <div class="shop-pin__dots" aria-label="3 digits entered"><span class="shop-pin__dot is-filled"></span><span class="shop-pin__dot is-filled"></span><span class="shop-pin__dot is-filled"></span><span class="shop-pin__dot"></span><span class="shop-pin__dot is-optional"></span><span class="shop-pin__dot is-optional"></span></div>
      <div class="shop-pin__pad">
        <button class="shop-pin__key" type="button">1</button><button class="shop-pin__key" type="button">2</button><button class="shop-pin__key" type="button">3</button><button class="shop-pin__key" type="button">4</button><button class="shop-pin__key" type="button">5</button><button class="shop-pin__key" type="button">6</button><button class="shop-pin__key" type="button">7</button><button class="shop-pin__key" type="button">8</button><button class="shop-pin__key" type="button">9</button>
        <a class="shop-pin__key shop-pin__key--fn" href="screen-16-switch-user.html">Not you?</a><button class="shop-pin__key" type="button">0</button><button class="shop-pin__key shop-pin__key--fn" type="button" aria-label="Delete"><svg class="shop-ico shop-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"></path><path d="m12 9 6 6"></path><path d="m18 9-6 6"></path></svg></button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
