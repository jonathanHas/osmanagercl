<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13 F&V waste · Shop mode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="shop.css">
<style>body{margin:0;background:#f5ead8}</style>
</head>
<body>
<div class="shop is-touch" data-screen-label="13 FV waste">
  <header class="shop-topbar">
    <a class="shop-iconbtn" href="screen-01-home.html" aria-label="Back"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 class="shop-topbar__title">Fruit &amp; veg</h1>
    <details class="shop-usermenu">
      <summary class="shop-chip"><span class="shop-avatar">MJ</span><span class="shop-chip__name">Maya</span><svg class="shop-ico shop-ico--sm shop-chip__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary>
      <div class="shop-menu" role="menu">
        <div class="shop-menu__head"><span class="shop-avatar">MJ</span><div><div class="shop-menu__name">Maya Jensen</div><div class="shop-meta">Shop floor</div></div></div>
        <a class="shop-menu__item" role="menuitem" href="screen-16-switch-user.html"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Switch user</a>
        <a class="shop-menu__item" role="menuitem" href="screen-18-locked.html"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Lock</a>
        <a class="shop-menu__item" role="menuitem" href="#"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg>Office</a>
        <div class="shop-menu__sep"></div>
        <a class="shop-menu__item shop-menu__item--danger" role="menuitem" href="#"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Log out</a>
      </div>
    </details>
  </header>
  <main class="shop-page">
    <nav class="shop-seg" aria-label="Fruit and veg"><a class="shop-seg__opt" href="screen-12-fv-availability.html">Availability</a><a class="shop-seg__opt" href="screen-13-fv-waste.html" aria-current="page">Waste log</a><a class="shop-seg__opt" href="screen-14-fv-harvest.html">Harvest</a><a class="shop-seg__opt" href="screen-15-fv-labels.html">Labels</a></nav>
    <div class="shop-split">
      <section class="shop-stack">
        <h2 class="shop-subtitle">1 · Product</h2>
        <div class="shop-search"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input class="shop-input" type="search" placeholder="Search products"></div>
        <div class="shop-choices">
          <label class="shop-choice"><input type="radio" name="p" checked>Bananas<small>per kg</small></label><label class="shop-choice"><input type="radio" name="p">Avocado<small>each</small></label><label class="shop-choice"><input type="radio" name="p">Strawberries<small>250 g punnet</small></label><label class="shop-choice"><input type="radio" name="p">Lettuce, butter<small>each</small></label><label class="shop-choice"><input type="radio" name="p">Tomatoes, vine<small>per kg</small></label><label class="shop-choice"><input type="radio" name="p">Mushrooms<small>per kg</small></label>
        </div>
      </section>
      <section class="shop-card">
        <h2 class="shop-subtitle">2 · How much</h2>
        <div class="shop-stepper"><button class="shop-iconbtn shop-iconbtn--lg" type="button" aria-label="Less"><svg class="shop-ico shop-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button><output class="shop-stepper__value">1.5 kg</output><button class="shop-iconbtn shop-iconbtn--lg" type="button" aria-label="More"><svg class="shop-ico shop-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button></div>
        <h2 class="shop-subtitle">3 · Reason</h2>
        <div class="shop-choices">
          <label class="shop-choice"><input type="radio" name="r" checked>Spoiled</label><label class="shop-choice"><input type="radio" name="r">Damaged</label><label class="shop-choice"><input type="radio" name="r">Past date</label><label class="shop-choice"><input type="radio" name="r">Other</label>
        </div>
      </section>
    </div>
    <div class="shop-actions"><button class="shop-btn shop-btn--primary shop-btn--lg" type="button"><svg class="shop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>Log 1.5 kg bananas</button></div>
  </main>
</div>
</body>
</html>
